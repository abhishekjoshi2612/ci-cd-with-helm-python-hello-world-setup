


on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs: 
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
          python-version: '3.11'  # Specify the version of Python you want to install
    
    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install pylint
        
    - name: Run pylint
      run: |
          pylint main.py || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build Docker image
      run: |
          docker build -t abhishek2691999/abhishek-flask-app:${{ github.run_id }} .
    
    - name: Push Docker image
      run: |
          docker push abhishek2691999/abhishek-flask-app:${{ github.run_id }}
    
    - name: update-tags
      run: |
           sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/python-app-development/values.yaml
   
    - name: Commit and push changes
      run: |
        git config --global user.email "abhishekjoshi26121999@gmail.com"
        git config --global user.name "Abhishek Joshi"
        git add helm/python-app-development/values.yaml
        git commit -m "Update tag in Helm chart"
        git push

    - name: Set up Java (required for SonarCloud)
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Install SonarScanner
      run: |
        curl -sSLo sonar-scanner-cli.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.8.0.2856-linux.zip
        unzip sonar-scanner-cli.zip -d $HOME
        export PATH=$HOME/sonar-scanner-4.8.0.2856-linux/bin:$PATH
        echo "PATH=$HOME/sonar-scanner-4.8.0.2856-linux/bin:\$PATH" >> $GITHUB_ENV

    - name: Run SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@v2
      with:
       projectKey: abhishekjoshi2612_ci-cd-with-helm-python-hello-world-setup
       organization: ${{ secrets.ORGANIZATION_KEY }}
       token: ${{ secrets.SONAR_TOKEN }}
     
