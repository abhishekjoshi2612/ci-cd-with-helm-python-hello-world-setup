on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint

      - name: Run pylint
        run: |
          pylint main.py || true

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t abhishek2691999/abhishek-flask-app:${{ github.run_id }} .

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push abhishek2691999/abhishek-flask-app:${{ github.run_id }}

      # Update tags in Helm chart
      - name: Update Helm chart image tag
        run: |
          sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/python-app-development/values.yaml
      
      - name: Commit and push changes
        run: |
          git config --global user.email "abhishekjoshi26121999@gmail.com"
          git config --global user.name "Abhishek Joshi"
          git add helm/python-app-development/values.yaml
          git commit -m "Update Docker image tag in Helm chart"
          git push

      # Trivy scan for Docker image
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: abhishek2691999/abhishek-flask-app:${{ github.run_id }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true # Logs vulnerabilities but doesn’t fail the pipeline

      # Set up Java (required for SonarCloud)
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      # Configure SonarCloud
      - name: Configure SonarCloud
        run: |
          echo "sonar.organization=${{ secrets.ORGANIZATION_KEY }}" > sonar-project.properties
          echo "sonar.projectKey=abhishekjoshi2612_ci-cd-with-helm-python-hello-world-setup" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties

      # Run SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
