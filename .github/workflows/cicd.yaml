on:
  push:
    branches:
      - main
    paths-ignore:
      - 'helm/**'
      - 'k8s/**'
      - 'README.md'

jobs: 
  build:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
          python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
    
    - name: Run pylint
      run: |
        pylint main.py || true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build Docker image
      run: |
        docker build -t abhishek2691999/abhishek-flask-app:${{ github.run_id }} .
    
    - name: Push Docker image
      run: |
        docker push abhishek2691999/abhishek-flask-app:${{ github.run_id }}
    
    - name: Update tags in Helm chart
      run: |
        sed -i 's/tag: .*/tag: "${{github.run_id}}"/' helm/python-app-development/values.yaml
   
    - name: Commit and push changes
      run: |
        git config --global user.email "abhishekjoshi26121999@gmail.com"
        git config --global user.name "Abhishek Joshi"
        git add helm/python-app-development/values.yaml
        git commit -m "Update tag in Helm chart"
        git push

    - name: Set up Java (required for SonarCloud)
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Configure SonarCloud
      run: |
        echo "sonar.organization=${{ secrets.ORGANIZATION_KEY }}" > sonar-project.properties
        echo "sonar.projectKey=abhishekjoshi2612_ci-cd-with-helm-python-hello-world-setup" >> sonar-project.properties
        echo "sonar.sources=." >> sonar-project.properties

    - name: SonarCloud Scan
      uses: sonarsource/sonarcloud-github-action@v4.0.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
